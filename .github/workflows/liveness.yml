# Proves the demo is not a recording: runs the real UCP cycle against the live
# store on every push and once a day, and fails if the merchant stops answering.
name: UCP cycle

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Anonymous agents share one rate-limit pool, and checkout creation is
      # metered far tighter than catalog or cart. Pushes prove the merchant is
      # answering without spending the quota the public demo page needs; the
      # daily run exercises checkout and delivery as well.
      - name: Run the cycle (push — stops at the cart)
        if: github.event_name == 'push'
        run: node scripts/demo-cycle.mjs --query "floral grass" --no-checkout
      - name: Run the full cycle (scheduled or manual)
        if: github.event_name != 'push'
        run: node scripts/demo-cycle.mjs --query "floral grass"
      - name: Audit catalog readiness
        run: node scripts/audit-catalog.mjs
